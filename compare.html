<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare — LSRTA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{shell,requireLogin,$,loadReports,askAI,escapeHtml}from'./app.js';document.body.innerHTML=shell('compare.html','Compare Reports','Compare two saved reports and identify changes');requireLogin(init);let reports=[];async function init(){reports=await loadReports().catch(()=>[]);render();}function options(){return reports.map(r=>`<option value="${r.id}">${escapeHtml(r.label||r.type||'Report')} — ${new Date(r.timestamp||Date.now()).toLocaleDateString()}</option>`).join('')}function render(){$('pageContent').innerHTML=`<div class="card"><div class="card-h"><div class="card-t">Select Reports</div></div><div class="card-b"><div id="err" class="error"></div><div class="grid grid-2"><div class="field"><label>Report A</label><select id="a">${options()}</select></div><div class="field"><label>Report B</label><select id="b">${options()}</select></div></div><button class="btn btn-primary" id="go">Compare</button></div></div><div class="card"><div class="card-h"><div class="card-t">Comparison Result</div></div><div class="card-b"><div id="out" class="ai-box">No comparison yet.</div></div></div>`;$('go').onclick=compare;}async function compare(){const a=reports.find(r=>r.id===$('a').value),b=reports.find(r=>r.id===$('b').value);if(!a||!b||a.id===b.id){$('err').textContent='Choose two different reports.';$('err').classList.add('show');return}$('err').classList.remove('show');$('out').textContent='Comparing...';try{$('out').textContent=await askAI(`Compare these two property management reports. Identify improvements, declines, risks, and next actions.\n\nREPORT A:\n${a.analysis||JSON.stringify(a)}\n\nREPORT B:\n${b.analysis||JSON.stringify(b)}`,1800)}catch(e){$('out').textContent=e.message}}</script></body></html>
