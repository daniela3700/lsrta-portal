<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Roll — LSRTA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{shell,requireLogin,$,readText,askAI,saveReport,loadReports,escapeHtml,show,hide}from'./app.js';document.body.innerHTML=shell('rentroll.html','Rent Roll','Review renewal, rent, and lease risk');requireLogin(init);let files=[];function init(){render();}function render(){$('pageContent').innerHTML=`<div class="card"><div class="card-h"><div><div class="card-t">Upload CSV/TXT</div><div class="muted">PDF, XLSX, DOCX should be converted first or handled through AppFolio sync.</div></div></div><div class="card-b"><div id="err" class="error"></div><div class="upload" id="drop"><div style="font-size:36px;margin-bottom:8px">📂</div><div>Click to select filerentroll</div><div class="muted">CSV or TXT only</div></div><input id="file" type="file" rentroll accept=".csv,.txt" class="hidden"><div id="list" style="margin:14px 0"></div><div class="grid grid-2"><div class="field"><label>Portfolio</label><select id="port"><option value="all">All Portfolios</option><option value="nc_gladysh">NC Gladysh Capital</option><option value="sc_platinum">SC Platinum Estates</option><option value="tx_acorn">TX Acorn Ridge</option></select></div><div class="field"><label>Report Label</label><input id="label" placeholder="Weekly report, rent roll, etc."></div></div><button class="btn btn-primary" id="analyze">Analyze</button></div></div><div class="card"><div class="card-h"><div class="card-t">AI Result</div><button class="btn btn-outline" id="save" disabled>Save Report</button></div><div class="card-b"><div id="out" class="ai-box">No analysis yet.</div></div></div><div class="card"><div class="card-h"><div class="card-t">Recent Saved Reports</div></div><div class="card-b" id="history"></div></div>`;$('drop').onclick=()=>$('file').click();$('file').onchange=()=>{files=[...$('file').files];drawFiles()};$('analyze').onclick=analyze;$('save').onclick=save;loadHistory();}function drawFiles(){$('list').innerHTML=files.map(f=>`<div class="chip" style="display:inline-block;margin:4px">${escapeHtml(f.name)}</div>`).join('')}let last='';async function analyze(){hide('err');if(!files.length){show('err','Select at least one CSV/TXT file.');return}$('analyze').disabled=true;$('out').textContent='Reading and analyzing...';try{const parts=[];for(const f of files){parts.push('FILE: '+f.name+'\n'+await readText(f));}const prompt='Analyze this Rent Roll data for a property manager. Pinpoint issues already not working, risks, trends, and direct next actions. Keep it practical.\n\n'+parts.join('\n\n---\n\n');last=await askAI(prompt,2200);$('out').textContent=last;$('save').disabled=false;}catch(e){show('err',e.message);$('out').textContent='No analysis generated.'}finally{$('analyze').disabled=false}}async function save(){await saveReport({type:'rentroll',label: $('label').value||'Rent Roll',portfolio: $('port').value,analysis:last,fileNames:files.map(f=>f.name)});$('save').disabled=true;loadHistory();}async function loadHistory(){const rows=await loadReports().catch(()=>[]);$('history').innerHTML=rows.slice(0,10).map(r=>`<div style="padding:10px 0;border-bottom:1px solid rgba(15,31,61,.06)"><strong>${escapeHtml(r.label||r.type||'Report')}</strong><div class="muted">${escapeHtml((r.fileNames||[]).join(', '))}</div></div>`).join('')||'<div class="empty">No saved reports.</div>'}</script></body></html>
