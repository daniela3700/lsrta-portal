<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — LSRTA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{shell,requireLogin,$,auth,db,ADMIN_EMAILS,show,hide}from'./app.js';import{collection,getDocs,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';document.body.innerHTML=shell('admin.html','Admin Panel','Team access and account records');requireLogin(init);async function init(user){if(!ADMIN_EMAILS.includes(user.email.toLowerCase())){$('pageContent').innerHTML='<div class="card empty">Access denied. Admin only.</div>';return}render();loadUsers();}function render(){$('pageContent').innerHTML=`<div class="card"><div class="card-h"><div class="card-t">Invite / Register User Record</div></div><div class="card-b"><div id="msg" class="success"></div><div id="err" class="error"></div><div class="warning show"><strong>Security note:</strong> Creating Firebase Auth users should be done with Firebase Admin SDK/backend. This form only creates or updates a Firestore user record/invite; it will not log the admin out.</div><div class="grid grid-3"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Role</label><select id="role"><option value="member">Member</option><option value="admin">Admin</option></select></div></div><button class="btn btn-primary" id="saveUser">Save User Record</button></div></div><div class="card"><div class="card-h"><div class="card-t">Users</div></div><div class="card-b" id="users"></div></div>`;$('saveUser').onclick=saveUser;}async function saveUser(){hide('err');hide('msg');try{const email=$('email').value.trim().toLowerCase();if(!email)throw new Error('Email required.');await setDoc(doc(db,'userInvites',email),{name:$('name').value.trim(),email,role:$('role').value,status:'pending',updatedAt:serverTimestamp()},{merge:true});show('msg','User invite record saved. Have the user create an account from the login page.');loadUsers();}catch(e){show('err',e.message)}}async function loadUsers(){const [users,invites]=await Promise.all([getDocs(collection(db,'users')).catch(()=>({docs:[]})),getDocs(collection(db,'userInvites')).catch(()=>({docs:[]}))]);const rows=[...users.docs.map(d=>d.data()),...invites.docs.map(d=>d.data())];$('users').innerHTML=rows.map(u=>`<div style="padding:12px 0;border-bottom:1px solid rgba(15,31,61,.06)"><strong>${u.name||'Unnamed'}</strong><div class="muted">${u.email||''} — ${u.role||'member'} ${u.status?'— '+u.status:''}</div></div>`).join('')||'<div class="empty">No users found.</div>';}</script></body></html>
