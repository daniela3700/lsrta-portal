<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — LSRTA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{shell,requireLogin,$,api,saveKpis,loadKpis,money,pct,PORTFOLIOS,askAI,show,hide}from'./app.js';document.body.innerHTML=shell('dashboard.html','Portfolio Dashboard','Sync AppFolio or upload reports to populate KPIs');requireLogin(init);let current='all',view='weekly',records=[];function init(){render();load();}function render(){document.getElementById('pageContent').innerHTML=`<div class="toolbar" style="justify-content:space-between;margin-bottom:18px"><div>${Object.entries(PORTFOLIOS).map(([k,v])=>`<button class="chip ${k===current?'active':''}" data-port="${k}">${v}</button>`).join('')}</div><button class="btn btn-gold" id="syncOpen">Sync AppFolio</button></div><div class="card"><div class="card-h"><div><div class="card-t">AI Executive Summary</div><div class="muted">Generated from saved KPI data</div></div><button class="btn btn-outline" id="summaryBtn">Generate</button></div><div class="card-b"><div class="ai-box" id="aiBox">No summary yet.</div></div></div><div id="dash"></div><div class="modal-bg" id="syncModal"><div class="modal"><div class="modal-h"><div class="title" style="font-size:22px">Sync from AppFolio</div><button class="x" id="closeSync">×</button></div><div class="modal-b"><div id="syncErr" class="error"></div><div class="grid grid-2"><div class="field"><label>Portfolio</label><select id="sPort">${Object.entries(PORTFOLIOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="sType"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>From Date</label><input type="date" id="sFrom"></div><div class="field"><label>To Date</label><input type="date" id="sTo"></div></div><button class="btn btn-primary" id="runSync" style="width:100%">Run Sync</button><div id="syncResult" style="margin-top:16px"></div></div></div></div>`;document.querySelectorAll('[data-port]').forEach(b=>b.onclick=()=>{current=b.dataset.port;render();draw()});$('syncOpen').onclick=()=>{$('syncModal').classList.add('open');const d=new Date();const to=d.toISOString().slice(0,10);d.setDate(d.getDate()-6);$('sFrom').value=d.toISOString().slice(0,10);$('sTo').value=to;$('sPort').value=current};$('closeSync').onclick=()=>$('syncModal').classList.remove('open');$('runSync').onclick=runSync;$('summaryBtn').onclick=genSummary;}async function load(){records=await loadKpis().catch(()=>[]);draw();}function latest(){return records.find(r=>current==='all'||r.portfolio===current)||null}function draw(){const r=latest();if(!r){$('dash').innerHTML='<div class="empty card">No KPI data yet. Click Sync AppFolio.</div>';return}const k=r.kpis||r;$('dash').innerHTML=`<div class="grid grid-4"><div class="stat"><div class="stat-l">Total Units</div><div class="stat-v">${k.total_units||0}</div></div><div class="stat"><div class="stat-l">Occupancy</div><div class="stat-v">${pct(k.occupancy_rate)}</div></div><div class="stat"><div class="stat-l">Leased</div><div class="stat-v">${k.leased||0}</div></div><div class="stat"><div class="stat-l">NOI</div><div class="stat-v">${money(k.noi)}</div></div></div><div class="card"><div class="card-h"><div class="card-t">Latest Period</div><div class="muted">${r.from_date||''} to ${r.to_date||''}</div></div><div class="card-b"><table><tbody>${Object.entries(k).filter(([a])=>!['syncedAt','syncedFrom','portfolio','from_date','to_date'].includes(a)).map(([a,b])=>`<tr><th>${a.replaceAll('_',' ')}</th><td>${typeof b==='number'?b.toLocaleString():b}</td></tr>`).join('')}</tbody></table></div></div>`;}async function runSync(){hide('syncErr');$('runSync').disabled=true;$('syncResult').innerHTML='<div class="muted">Syncing...</div>';try{const payload={portfolio:$('sPort').value,type:$('sType').value,from_date:$('sFrom').value,to_date:$('sTo').value};const data=await api('/appfolio-sync',payload);await saveKpis({...payload,kpis:data.kpis,reportStatus:data.reportStatus,rawCounts:data.rawCounts});records=await loadKpis();$('syncResult').innerHTML='<div class="success show">Sync saved successfully.</div>';draw();}catch(e){show('syncErr',e.message);$('syncResult').innerHTML='';}finally{$('runSync').disabled=false}}async function genSummary(){const r=latest();if(!r){$('aiBox').textContent='No KPI data available.';return}$('summaryBtn').disabled=true;$('aiBox').textContent='Generating...';try{$('aiBox').textContent=await askAI(`Write an executive property-management summary for this KPI data. Be direct and call out issues, leasing, occupancy, work orders, NOI, and next actions.\n\n${JSON.stringify(r.kpis||r,null,2)}`,1600)}catch(e){$('aiBox').textContent=e.message}finally{$('summaryBtn').disabled=false}}</script></body></html>
