<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Chat — LSRTA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{shell,requireLogin,$,db,auth,escapeHtml}from'./app.js';import{collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';document.body.innerHTML=shell('chat.html','Team Chat','Simple real-time team messages');requireLogin(init);function init(){$('pageContent').innerHTML=`<div class="card"><div class="card-h"><div class="card-t">General</div></div><div class="card-b"><div id="msgs" style="height:55vh;overflow:auto;border:1px solid rgba(15,31,61,.08);padding:14px;border-radius:5px;background:#fafbfc"></div><div style="display:flex;gap:10px;margin-top:12px"><input id="msg" class="field" style="flex:1;margin:0" placeholder="Type a message..."><button class="btn btn-primary" id="send">Send</button></div></div></div>`;const q=query(collection(db,'messages'),orderBy('timestamp','desc'),limit(100));onSnapshot(q,s=>{const rows=s.docs.map(d=>d.data()).reverse();$('msgs').innerHTML=rows.map(m=>`<div style="padding:8px 0;border-bottom:1px solid rgba(15,31,61,.05)"><strong>${escapeHtml(m.name||m.email||'User')}</strong><span class="muted"> ${m.createdLabel||''}</span><div>${escapeHtml(m.text||'')}</div></div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight;});$('send').onclick=send;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});}async function send(){const text=$('msg').value.trim();if(!text)return;const u=auth.currentUser;await addDoc(collection(db,'messages'),{text,email:u.email,name:u.displayName||u.email?.split('@')[0],timestamp:serverTimestamp(),createdLabel:new Date().toLocaleString()});$('msg').value='';}</script></body></html>
